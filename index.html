<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <!-- Built-in Cloud Connection Engine -->
    <script src="https://unpkg.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; margin: 15px auto; max-width: 300px; }
        .percentage { font-size: 40px; font-weight: bold; color: #22d3ee; margin: 10px 0; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; cursor: pointer; background-color: #2563eb; color: white; }
    </style>
</head>
<body>
    <h1>Building Water Dashboard</h1>
    <p id="status" style="color: #eab308;">Connecting to cloud stream...</p>

    <div class="card">
        <p>HITACHI TANK</p>
        <div id="hitachi-pct" class="percentage">0%</div>
        <button onclick="sendPulse('hitachi')">Pulse Hitachi</button>
    </div>

    <div class="card">
        <p>KAVERI TANK</p>
        <div id="kaveri-pct" class="percentage">0%</div>
        <button style="background-color:#dc2626;" onclick="sendPulse('kaveri')">Pulse Kaveri</button>
    </div>

    <script>
        // Connecting to the secure cloud stream
        const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");
        
        client.on('connect', () => { 
            document.getElementById('status').innerText = "Global Cloud Connected!";
            document.getElementById('status').style.color = "#10b981";
            client.subscribe("varun/water/data"); 
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            if(data.hitachi !== undefined) document.getElementById('hitachi-pct').innerText = data.hitachi + "%";
            if(data.kaveri !== undefined) document.getElementById('kaveri-pct').innerText = data.kaveri + "%";
        });

        function sendPulse(motorName) {
            client.publish("varun/water/commands", motorName);
            alert("Pulse signal sent to " + motorName);
        }
    </script>
</body>
</html>
