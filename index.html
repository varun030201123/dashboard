<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <!-- Universally Supported Styling & Cloud Engines -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen p-4 md:p-8 flex flex-col justify-between">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="text-center md:text-left border-b border-slate-800 pb-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-2xl font-extrabold text-cyan-400 uppercase">Building Water Dashboard</h1>
                <p class="text-slate-400 text-xs mt-1">Portal Shared Infrastructure • Live Monitoring</p>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[10px] uppercase font-bold text-emerald-400">Cloud Active</span>
            </div>
        </header>

        <!-- Tanks Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- HITACHI -->
            <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col justify-between space-y-4">
                <div class="text-center space-y-1">
                    <p class="text-[11px] uppercase text-slate-400 font-bold tracking-widest">Hitachi Tank</p>
                    <h2 id="hitachi-pct" class="text-4xl font-extrabold text-cyan-400">0%</h2>
                </div>
                <div class="w-full bg-slate-950 rounded-xl h-6 p-1 border border-slate-800">
                    <div id="hitachi-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-lg transition-all duration-1000" style="width: 0%;"></div>
                </div>
                <button onclick="sendPulse('hitachi')" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl text-xs uppercase cursor-pointer">Pulse Motor</button>
            </div>
            <!-- KAVERI -->
            <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col justify-between space-y-4">
                <div class="text-center space-y-1">
                    <p class="text-[11px] uppercase text-slate-400 font-bold tracking-widest">Kaveri Tank</p>
                    <h2 id="kaveri-pct" class="text-4xl font-extrabold text-cyan-400">0%</h2>
                </div>
                <div class="w-full bg-slate-950 rounded-xl h-6 p-1 border border-slate-800">
                    <div id="kaveri-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-lg transition-all duration-1000" style="width: 0%;"></div>
                </div>
                <button onclick="sendPulse('kaveri')" class="w-full py-3 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold rounded-xl text-xs uppercase cursor-pointer">Pulse Motor</button>
            </div>
            <!-- SUMP -->
            <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col justify-between space-y-4">
                <div class="text-center space-y-1">
                    <p class="text-[11px] uppercase text-slate-400 font-bold tracking-widest">Underground Sump</p>
                    <h2 id="sump-pct" class="text-4xl font-extrabold text-emerald-400">0%</h2>
                </div>
                <div class="w-full bg-slate-950 rounded-xl h-6 p-1 border border-slate-800">
                    <div id="sump-bar" class="bg-gradient-to-r from-emerald-600 to-teal-400 h-full rounded-lg transition-all duration-1000" style="width: 0%;"></div>
                </div>
                <div class="py-2.5 text-center bg-slate-900/40 text-slate-500 text-[10px] uppercase font-bold border border-slate-800/40 rounded-xl">Monitoring Only</div>
            </div>
        </div>

        <!-- ZEBRONICS SMART PLUG -->
        <div class="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-6 mt-6">
            <div class="space-y-1 text-center sm:text-left">
                <h3 class="text-lg font-bold text-slate-100">Main Zebronics Smart Plug</h3>
                <p class="text-[11px] text-slate-500">ID: d7210d68a7251db57e6vrz</p>
                <div class="flex items-center justify-center sm:justify-start gap-2 mt-2">
                    <span class="text-xs font-semibold text-slate-400">Plug State:</span>
                    <span id="plug-status" class="text-xs font-extrabold bg-slate-900 px-2.5 py-0.5 rounded-md border border-slate-800 text-slate-400">Loading...</span>
                </div>
            </div>
            <button onclick="toggleZebronicsPlug()" class="w-full sm:w-auto px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl uppercase text-xs cursor-pointer">Toggle Smart Plug</button>
        </div>
    </div>

    <script>
        const client = mqtt.connect("wss://://hivemq.com");
        const TOPIC_WATER = "varunshouse789/water/data";
        const TOPIC_COMMANDS = "varunshouse789/water/commands";
        const TOPIC_PLUG_STATUS = "varunshouse789/zebronics/status";

        client.on('connect', () => { 
            client.subscribe(TOPIC_WATER); 
            client.subscribe(TOPIC_PLUG_STATUS); 
        });

        client.on('message', (topic, message) => {
            const payload = message.toString();
            if (topic === TOPIC_WATER) {
                try {
                    const data = JSON.parse(payload);
                    if(data.hitachi !== undefined) {
                        document.getElementById('hitachi-pct').innerText = data.hitachi + "%";
                        document.getElementById('hitachi-bar').style.width = data.hitachi + "%";
                    }
                    if(data.kaveri !== undefined) {
                        document.getElementById('kaveri-pct').innerText = data.kaveri + "%";
                        document.getElementById('kaveri-bar').style.width = data.kaveri + "%";
                    }
                    if(data.sump !== undefined) {
                        document.getElementById('sump-pct').innerText = data.sump + "%";
                        document.getElementById('sump-bar').style.width = data.sump + "%";
                    }
                } catch(e) {}
            }
            if (topic === TOPIC_PLUG_STATUS) {
                const el = document.getElementById('plug-status');
                el.innerText = payload.toUpperCase();
                el.className = payload.toUpperCase() === "ON" ? "text-xs font-extrabold bg-emerald-500/10 px-2.5 py-0.5 rounded-md border border-emerald-500/30 text-emerald-400" : "text-xs font-extrabold bg-rose-500/10 px-2.5 py-0.5 rounded-md border border-rose-500/30 text-rose-400";
            }
        });

        // Trigger pulse command
        function sendPulse(motorName) {
            client.publish(TOPIC_COMMANDS, motorName);
            alert("Sent quick pulse trigger to " + motorName + " motor!");
        }

        function toggleZebronicsPlug() {
            alert("Zebronics switch clicked! Link your IFTTT webhook key here later.");
        }
    </script>
</body>
</html>
