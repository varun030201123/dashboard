<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 500px; width: 100%; }
        header { text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #22d3ee; text-transform: uppercase; letter-spacing: 2px; margin: 0; font-size: 22px; }
        .card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .title { text-transform: uppercase; color: #94a3b8; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        .pct { font-size: 38px; font-weight: 800; color: #22d3ee; margin: 5px 0; }
        .bar-bg { background-color: #020617; border: 1px solid #1e293b; border-radius: 6px; height: 14px; padding: 2px; overflow: hidden; }
        .bar { background: linear-gradient(to right, #2563eb, #22d3ee); height: 100%; border-radius: 4px; width: 0%; transition: width 0.5s ease; }
        .sump-text { color: #34d399; }
        .sump-bar { background: linear-gradient(to right, #059669, #34d399); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Building Water Dashboard</h1>
            <p style="color: #10b981; font-size: 11px; margin: 5px 0 0 0; font-weight: bold;">Secure Data Vault Sync Active</p>
        </header>

        <!-- HITACHI -->
        <div class="card">
            <p class="title">Hitachi Tank</p>
            <div id="h" class="pct">0%</div>
            <div class="bar-bg"><div id="hb" class="bar"></div></div>
        </div>

        <!-- KAVERI -->
        <div class="card">
            <p class="title">Kaveri Tank</p>
            <div id="k" class="pct">0%</div>
            <div class="bar-bg"><div id="kb" class="bar"></div></div>
        </div>

        <!-- UNDERGROUND SUMP -->
        <div class="card">
            <p class="title">Underground Sump</p>
            <div id="s" class="pct" style="color: #34d399;">0%</div>
            <div class="bar-bg"><div id="sb" class="bar sump-bar"></div></div>
        </div>
    </div>

    <script>
        async function loadStoredLevels() {
            try {
                // Instantly grabs historical raw data straight from your repository asset loop
                const response = await fetch("data.json?t=" + new Date().getTime());
                const rawText = await response.text();
                
                if (rawText) {
                    // Browser safely extracts numbers directly from the text dump using regex search scans
                    const matchHitachi = rawText.match(/Hitachi.*?(\d+)%/i);
                    const matchKaveri = rawText.match(/Kaveri.*?(\d+)%/i);
                    const matchSump = rawText.match(/Sump.*?(\d+)%/i);

                    if (matchHitachi) { 
                        document.getElementById('h').innerText = matchHitachi[1] + "%"; 
                        document.getElementById('hb').style.width = matchHitachi[1] + "%"; 
                    }
                    if (matchKaveri) { 
                        document.getElementById('k').innerText = matchKaveri[1] + "%"; 
                        document.getElementById('kb').style.width = matchKaveri[1] + "%"; 
                    }
                    if (matchSump) { 
                        document.getElementById('s').innerText = matchSump[1] + "%"; 
                        document.getElementById('sb').style.width = matchSump[1] + "%"; 
                    }
                }
            } catch (e) {}
        }
        setInterval(loadStoredLevels, 5000);
        loadStoredLevels();
    </script>
</body>
</html>
