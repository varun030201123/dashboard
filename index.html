<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Water Portal</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
    .card { background: #1e293b; padding: 20px; margin: 15px auto; border-radius: 12px; max-width: 340px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h3 { margin: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { font-size: 40px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
    .litres { font-size: 16px; color: #cbd5e1; margin-bottom: 15px; }
    .btn { background: #3b82f6; color: #fff; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-kaveri { background: #ef4444; }
    .btn-kaveri:hover { background: #dc2626; }
    .status { font-size: 11px; color: #64748b; margin-top: 15px; }
  </style>
  <script>
    const FIREBASE_URL = "https://firebaseio.com";

    async function getLatestMetrics() {
      try {
        let res = await fetch(FIREBASE_URL + "live.json");
        let data = await res.json();
        
        if (data) {
          document.getElementById('h_pct').innerText = (data.hitachi !== undefined ? data.hitachi : "--") + '%';
          document.getElementById('h_lit').innerText = (data.hitachiL !== undefined ? data.hitachiL : "--") + ' L';
          document.getElementById('k_pct').innerText = (data.kaveri !== undefined ? data.kaveri : "--") + '%';
          document.getElementById('k_lit').innerText = (data.kaveriL !== undefined ? data.kaveriL : "--") + ' L';
          document.getElementById('s_pct').innerText = (data.sump !== undefined ? data.sump : "--") + '%';
          document.getElementById('s_lit').innerText = (data.sumpL !== undefined ? data.sumpL : "--") + ' L';
          
          document.getElementById('ts').innerText = "Live Telemetry Sync Active • " + new Date().toLocaleTimeString();
        }
      } catch(e) {
        document.getElementById('ts').innerText = "Connecting to storage channel...";
      }
    }

    // FIXED TRIGGER: Uses explicit cross-origin headers to push variables to Firebase successfully
    async function triggerHardware(pumpType) {
      try {
        let payload = {};
        if (pumpType === 'hitachi') payload = { "cmd_hitachi": 1, "cmd_kaveri": 0 };
        if (pumpType === 'kaveri')  payload = { "cmd_hitachi": 0, "cmd_kaveri": 1 };

        let url = FIREBASE_URL + "control.json";
        let response = await fetch(url, {
          method: "PUT",
          mode: "cors", // Explicitly forces cors compliance mapping
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error();
        alert("🚀 Pump activation variable committed to your home database cluster!");
      } catch(e) {
        alert("Transmission processing failure. Verify Firebase rules configuration.");
      }
    }

    setInterval(getLatestMetrics, 3000);
    window.onload = getLatestMetrics;
  </script>
</head>
<body>
  <h2>GLOBAL WATER PORTAL</h2>
  
  <div class="card">
    <h3>Hitachi Tank</h3>
    <div id="h_pct" class="val">--%</div>
    <div id="h_lit" class="litres">-- L</div>
    <button class="btn" onclick="triggerHardware('hitachi')">START HITACHI PUMP</button>
  </div>
  
  <div class="card">
    <h3>Kaveri Tank</h3>
    <div id="k_pct" class="val" style="color:#ef4444">--%</div>
    <div id="k_lit" class="litres">-- L</div>
    <button class="btn btn-kaveri" onclick="triggerHardware('kaveri')">START KAVERI PUMP</button>
  </div>
  
  <div class="card">
    <h3>Underground Sump</h3>
    <div id="s_pct" class="val" style="color:#10b981">--%</div>
    <div id="s_lit" class="litres">-- L</div>
  </div>
  
  <div id="ts" class="status">Connecting to storage channel...</div>
</body>
</html>
