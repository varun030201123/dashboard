<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard Portal</title>
    <!-- Universally Supported Embedded Style Engine -->
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-h: 100vh; justify-content: space-between; box-sizing: border-box; }
        .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 10px; }
        h1 { color: #22d3ee; text-transform: uppercase; letter-spacing: 2px; margin: 0; font-size: 22px; }
        .window-wrapper { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); height: 500px; width: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background-color: #111827; }
        .plug-card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .plug-title { font-size: 16px; font-weight: bold; margin: 0; color: #f1f5f9; }
        .plug-id { font-size: 11px; color: #64748b; margin: 4px 0 0 0; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; background-color: #2563eb; color: white; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        @media(min-width: 640px) { .plug-card { flex-direction: row; align-items: center; justify-content: space-between; } button { width: auto; padding: 14px 40px; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Header Title -->
        <header>
            <h1>Building Water Dashboard</h1>

        </header>

        <!-- Live Pass-Through Window Mirroring Your Original ESP32 Interface -->
        <div class="window-wrapper">
            <iframe src="http://192.168.1.198" allow="fullscreen"></iframe>
        </div>

        <!-- Unified Zebronics Smart Plug Toggle Trigger Card -->
        <div class="plug-card">
            <div>
                <h3 class="plug-title">Main Zebronics Smart Plug</h3>
                <p class="plug-id">Hardware Node ID: d7210d68a7251db57e6vrz</p>
            </div>
            <button onclick="toggleZebronicsPlug()">Toggle Smart Plug</button>
        </div>
    </div>

    <script>
        function toggleZebronicsPlug() {
            // This button trigger will be linked to your cloud IFTTT webhook link later
            alert("Zebronics switch clicked! Cloud routing hook is ready.");
        }
    </script>
</body>
</html>
