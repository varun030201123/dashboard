<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Water Portal</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
    .card { background: #1e293b; padding: 20px; margin: 15px auto; border-radius: 12px; max-width: 340px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h3 { margin: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { font-size: 40px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
    .litres { font-size: 16px; color: #cbd5e1; margin-bottom: 15px; }
    .btn { background: #3b82f6; color: #fff; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-kaveri { background: #ef4444; }
    .btn-kaveri:hover { background: #dc2626; }
    .status { font-size: 11px; color: #64748b; margin-top: 15px; }
  </style>
  <!-- Load Official Paho MQTT Web Client Library -->
  <script src="https://cloudflare.com" type="text/javascript"></script>
</head>
<body>
  <h2>GLOBAL WATER PORTAL</h2>
  
  <div class="card">
    <h3>Hitachi Tank</h3>
    <div id="h_pct" class="val">--%</div>
    <div id="h_lit" class="litres">-- L</div>
    <button class="btn" onclick="sendTrigger('PULSE_HITACHI')">START HITACHI PUMP</button>
  </div>
  
  <div class="card">
    <h3>Kaveri Tank</h3>
    <div id="k_pct" class="val" style="color:#ef4444">--%</div>
    <div id="k_lit" class="litres">-- L</div>
    <button class="btn btn-kaveri" onclick="sendTrigger('PULSE_KAVERI')">START KAVERI PUMP</button>
  </div>
  
  <div class="card">
    <h3>Underground Sump</h3>
    <div id="s_pct" class="val" style="color:#10b981">--%</div>
    <div id="s_lit" class="litres">-- L</div>
  </div>
  
  <div id="ts" class="status">Connecting to secure cloud link...</div>

  <script>
    const mqtt_host = "b43f34d3a7be4a62be5e866909dc3ffc.s1.eu.hivemq.cloud";
    const mqtt_port = 8884; // Secure WebSockets SSL port for browsers
    
    let client = new Paho.MQTT.Client(mqtt_host, mqtt_port, "web_client_" + Math.random().toString(16).substr(2, 8));

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    let options = {
      useSSL: true,
      userName: "varun",
      password: "Varun322001",
      onSuccess: onConnect,
      onFailure: onFailure
    };

    client.connect(options);

    function onConnect() {
      document.getElementById('ts').innerText = "Live Secure Tunnel Sync Active";
      client.subscribe("home/water/live");
    }

    function onFailure(err) {
      document.getElementById('ts').innerText = "Connection failed. Retrying...";
      setTimeout(() => client.connect(options), 5000);
    }

    function onConnectionLost(responseObject) {
      document.getElementById('ts').innerText = "Link broken. Re-establishing secure connection...";
      setTimeout(() => client.connect(options), 5000);
    }

    function onMessageArrived(message) {
      try {
        let data = JSON.parse(message.payloadString);
        document.getElementById('h_pct').innerText = data.hitachi + '%';
        document.getElementById('h_lit').innerText = data.hitachiL + ' L';
        document.getElementById('k_pct').innerText = data.kaveri + '%';
        document.getElementById('k_lit').innerText = data.kaveriL + ' L';
        document.getElementById('s_pct').innerText = data.sump + '%';
        document.getElementById('s_lit').innerText = data.sumpL + ' L';
      } catch(e) {}
    }

    function sendTrigger(actionCommand) {
      try {
        let message = new Paho.MQTT.Message(actionCommand);
        message.destinationName = "home/water/control";
        client.send(message);
        alert("🚀 Command dispatched successfully down into the home hardware tunnel!");
      } catch(e) {
        alert("Transmission processing failure.");
      }
    }
  </script>
</body>
</html>
