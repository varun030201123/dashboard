<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Global Water Portal</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
    .card { background: #1e293b; padding: 20px; margin: 15px auto; border-radius: 12px; max-width: 340px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h3 { margin: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { font-size: 40px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
    .status { font-size: 11px; color: #64748b; margin-top: 15px; }
  </style>
  <script>
    // CHANGE THIS TO YOUR UNIQUE THINGSPEAK CHANNEL ID NUMBER
    const CHANNEL_ID = "PASTE_YOUR_THINGSPEAK_CHANNEL_ID_HERE"; 

    async function getLatestMetrics() {
      try {
        let res = await fetch(`https://thingspeak.com{CHANNEL_ID}/feeds.json?results=1`);
        let data = await res.json();
        
        if (data && data.feeds && data.feeds.length > 0) {
          let lastFeed = data.feeds[0];
          
          document.getElementById('h_pct').innerText = (lastFeed.field1 || "0") + '%';
          document.getElementById('k_pct').innerText = (lastFeed.field2 || "0") + '%';
          document.getElementById('s_pct').innerText = (lastFeed.field3 || "0") + '%';
          
          document.getElementById('ts').innerText = "Live Telemetry Sync Active • " + new Date(lastFeed.created_at).toLocaleTimeString();
        }
      } catch(e) {
        document.getElementById('ts').innerText = "Connecting to global data servers...";
      }
    }

    setInterval(getLatestMetrics, 5000);
    window.onload = getLatestMetrics;
  </script>
</head>
<body>
  <h2>GLOBAL WATER PORTAL</h2>
  
  <div class="card">
    <h3>Hitachi Tank</h3>
    <div id="h_pct" class="val">--%</div>
  </div>
  
  <div class="card">
    <h3>Kaveri Tank</h3>
    <div id="k_pct" class="val" style="color:#ef4444">--%</div>
  </div>
  
  <div class="card">
    <h3>Underground Sump</h3>
    <div id="s_pct" class="val" style="color:#10b981">--%</div>
  </div>
  
  <div id="ts" class="status">Connecting to storage channel...</div>
</body>
</html>
