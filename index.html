<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        header { text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #22d3ee; text-transform: uppercase; letter-spacing: 2px; margin: 0; font-size: 24px; }
        .card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .title { text-transform: uppercase; color: #94a3b8; font-size: 11px; font-weight: bold; margin: 0 0 5px 0; letter-spacing: 1px; }
        .pct { font-size: 42px; font-weight: 800; color: #22d3ee; margin: 10px 0; }
        .bar-bg { background-color: #020617; border: 1px solid #1e293b; border-radius: 6px; height: 16px; padding: 2px; overflow: hidden; }
        .bar { background: linear-gradient(to right, #2563eb, #22d3ee); height: 100%; border-radius: 4px; width: 0%; transition: width 0.8s ease-in-out; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; font-size: 11px; cursor: pointer; margin-top: 15px; background-color: #2563eb; color: white; transition: background 0.2s; }
        .btn-red { background-color: #dc2626; }
        .sump-text { color: #34d399; }
        .sump-bar { background: linear-gradient(to right, #059669, #34d399); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Building Water Dashboard</h1>
            <p style="color: #10b981; font-size: 11px; margin: 5px 0 0 0; font-weight: bold;">Google Firebase Pipeline Active</p>
        </header>

        <!-- HITACHI TANK -->
        <div class="card">
            <p class="title">Hitachi Tank</p>
            <div id="h-pct" class="pct">0%</div>
            <div class="bar-bg"><div id="h-bar" class="bar"></div></div>
            <button onclick="sendCloudPulse('hitachi')">Pulse Hitachi Motor</button>
        </div>

        <!-- KAVERI TANK -->
        <div class="card">
            <p class="title">Kaveri Tank</p>
            <div id="k-pct" class="pct">0%</div>
            <div class="bar-bg"><div id="k-bar" class="bar"></div></div>
            <button onclick="sendCloudPulse('kaveri')" class="btn-red">Pulse Kaveri Motor</button>
        </div>

        <!-- UNDERGROUND SUMP -->
        <div class="card">
            <p class="title">Underground Sump</p>
            <div id="s-pct" class="pct sump-text">0%</div>
            <div class="bar-bg"><div id="s-bar" class="bar sump-bar"></div></div>
            <button style="background-color: #1e293b; color: #64748b; cursor: default;">Monitoring Only</button>
        </div>
    </div>

    <script>
        // Points directly to the clean dataset matching your hardware output configuration
        const fbTargetURL = "https://firebaseio.com";

        async function fetchWaterData() {
            try {
                const response = await fetch(fbTargetURL);
                const data = await response.json();
                if (data) {
                    if (data.hitachi !== undefined) {
                        document.getElementById('h-pct').innerText = data.hitachi + "%";
                        document.getElementById('h-bar').style.width = data.hitachi + "%";
                    }
                    if (data.kaveri !== undefined) {
                        document.getElementById('k-pct').innerText = data.kaveri + "%";
                        document.getElementById('k-bar').style.width = data.kaveri + "%";
                    }
                    if (data.sump !== undefined) {
                        document.getElementById('s-pct').innerText = data.sump + "%";
                        document.getElementById('s-bar').style.width = data.sump + "%";
                    }
                }
            } catch (error) { console.log("Database update fetch fail."); }
        }

        async function sendCloudPulse(motorName) {
            try {
                await fetch("https://firebaseio.com", {
                    method: "PUT",
                    body: JSON.stringify(motorName)
                });
                alert("Sent quick pulse trigger signal to physical " + motorName + " relay!");
            } catch (err) { alert("Network issue transmitting pulse."); }
        }

        setInterval(fetchWaterData, 3000);
        fetchWaterData();
    </script>
</body>
</html>
