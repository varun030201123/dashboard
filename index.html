<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; margin: 15px auto; max-width: 300px; }
        .percentage { font-size: 40px; font-weight: bold; color: #22d3ee; margin: 10px 0; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; cursor: pointer; background-color: #2563eb; color: white; }
    </style>
</head>
<body>
    <h1>Building Water Dashboard</h1>
    <p style="color: #10b981;">Firebase Global Routing Active</p>

    <div class="card">
        <p>HITACHI TANK</p>
        <div id="h" class="percentage">Loading...</div>
        <button onclick="sendCmd('hitachi')">Pulse Hitachi</button>
    </div>

    <div class="card">
        <p>KAVERI TANK</p>
        <div id="k" class="percentage">Loading...</div>
        <button style="background-color:#dc2626;" onclick="sendCmd('kaveri')">Pulse Kaveri</button>
    </div>

    <div class="card">
        <p>UNDERGROUND SUMP</p>
        <div id="s" class="percentage" style="color:#34d399;">Loading...</div>
    </div>

    <script>
        // REPLACE WITH YOUR REAL FIREBASE DATABASE LINK URL FROM STEP 1
        const firebaseURL = "https://console.firebase.google.com/u/0/project/water-level-indicator-f6a44/database/water-level-indicator-f6a44-default-rtdb/data/~2F";

        async function fetchLiveLevels() {
            try {
                const response = await fetch(firebaseURL);
                const data = await response.json();
                if(data) {
                    if(data.hitachi !== undefined) document.getElementById('h').innerText = data.hitachi + "%";
                    if(data.kaveri !== undefined) document.getElementById('k').innerText = data.kaveri + "%";
                    if(data.sump !== undefined) document.getElementById('s').innerText = data.sump + "%";
                }
            } catch (e) {}
        }
        
        async function sendCmd(motorName) {
            await fetch("https://firebaseio.com", {
                method: "PUT",
                body: JSON.stringify(motorName)
            });
            alert("Sent pulse command trigger to " + motorName);
        }

        setInterval(fetchLiveLevels, 3000);
        fetchLiveLevels();
    </script>
</body>
</html>
