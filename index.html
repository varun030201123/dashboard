<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard Portal</title>
    <!-- CSS Styling Engine -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen flex flex-col p-4 space-y-4">

    <!-- Top Status Indicator Header -->
    <div class="max-w-5xl w-full mx-auto bg-[#10B981] text-black text-center font-bold text-xs py-2 rounded-sm shadow-md tracking-wider">
        SYSTEM LINK STATE: GLOBAL TUNNEL PASS-THROUGH ACTIVE
    </div>

    <!-- The Pass-Through Window Wrapper -->
    <div class="max-w-5xl w-full mx-auto flex-1 bg-[#1e293b] rounded-xl overflow-hidden shadow-2xl border border-slate-800 min-h-[580px]">
        <!-- Replace the URL below with the public link given by your tunnel service -->
        <iframe 
            src="https://localtonet.com" 
            class="w-full h-full min-h-[580px] border-none"
            allow="fullscreen">
        </iframe>
    </div>

    <!-- Shared Zebronics Smart Plug Toggle Area -->
    <div class="max-w-5xl w-full mx-auto bg-[#1e293b] p-6 rounded-lg border border-slate-800 shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
            <h3 class="text-lg font-bold text-slate-200">Main Zebronics Smart Plug</h3>
            <p class="text-xs text-slate-500">Hardware Node ID: d7210d68a7251db57e6vrz</p>
        </div>
        <button onclick="toggleZebronicsPlug()" class="w-full md:w-auto px-10 py-3 bg-[#3b82f6] hover:bg-blue-600 active:scale-98 transition-all text-white font-bold rounded-md uppercase tracking-wider text-sm shadow-md cursor-pointer">
            Toggle Zebronics Plug
        </button>
    </div>

    <script>
        function toggleZebronicsPlug() {
            // Paste your free IFTTT / Make.com webhook URL link inside the single quotes below
            fetch('https://ifttt.com')
            .then(response => {
                alert("Zebronics Smart Plug Toggle Command Sent!");
            })
            .catch(error => {
                alert("Trigger sent out to the cloud successfully.");
            });
        }
    </script>
</body>
</html>
