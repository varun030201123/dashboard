<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Water Dashboard</title>
    <!-- Built-in Cloud Connection Engine -->
    <script src="https://unpkg.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        header { text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #22d3ee; text-transform: uppercase; letter-spacing: 2px; margin: 0; font-size: 24px; }
        .card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .title { text-transform: uppercase; color: #94a3b8; font-size: 11px; font-weight: bold; margin: 0 0 5px 0; letter-spacing: 1px; }
        .pct { font-size: 42px; font-weight: 800; color: #22d3ee; margin: 10px 0; }
        .bar-bg { background-color: #020617; border: 1px solid #1e293b; border-radius: 6px; height: 16px; padding: 2px; overflow: hidden; }
        .bar { background: linear-gradient(to right, #2563eb, #22d3ee); height: 100%; border-radius: 4px; width: 0%; transition: width 0.8s ease-in-out; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; font-size: 11px; cursor: pointer; margin-top: 15px; background-color: #2563eb; color: white; }
        .btn-red { background-color: #dc2626; }
        .sump-text { color: #34d399; }
        .sump-bar { background: linear-gradient(to right, #059669, #34d399); }
        .plug-card { background-color: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 25px; display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .plug-title { font-size: 18px; font-weight: bold; margin: 0; text-align: left; }
        @media(min-width: 640px) { .plug-card { flex-direction: row; align-items: center; justify-content: space-between; } .btn-toggle { width: auto; padding: 15px 40px; margin-top: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Building Water Dashboard</h1>
            <p id="state" style="color: #eab308; font-size: 11px; margin: 5px 0 0 0;">Connecting Global Secure Tunnel...</p>
        </header>

        <!-- HITACHI TANK -->
        <div class="card">
            <p class="title">Hitachi Tank</p>
            <div id="h-pct" class="pct">0%</div>
            <div class="bar-bg"><div id="h-bar" class="bar"></div></div>
            <button onclick="pulse('hitachi')">Pulse Hitachi Motor</button>
        </div>

        <!-- KAVERI TANK -->
        <div class="card">
            <p class="title">Kaveri Tank</p>
            <div id="k-pct" class="pct">0%</div>
            <div class="bar-bg"><div id="k-bar" class="bar"></div></div>
            <button onclick="pulse('kaveri')" class="btn-red">Pulse Kaveri Motor</button>
        </div>

        <!-- UNDERGROUND SUMP -->
        <div class="card">
            <p class="title">Underground Sump</p>
            <div id="s-pct" class="pct sump-text">0%</div>
            <div class="bar-bg"><div id="s-bar" class="bar sump-bar"></div></div>
            <button style="background-color: #1e293b; color: #64748b; cursor: default;">Monitoring Only</button>
        </div>

        <!-- ZEBRONICS CONTROL CARD -->
        <div class="plug-card">
            <div style="text-align: left;">
                <h3 class="plug-title">Main Zebronics Smart Plug</h3>
                <p style="font-size: 11px; color: #64748b; margin: 4px 0 0 0;">Hardware Node ID: d7210d68a7251db57e6vrz</p>
            </div>
            <button onclick="toggleZebronicsPlug()" class="btn-blue btn-toggle">Toggle Smart Plug</button>
        </div>
    </div>

    <script>
        // High-Uptime Secure WebSocket Port Connection Path
        const client = mqtt.connect("wss://://hivemq.com");
        
        client.on('connect', () => { 
            document.getElementById('state').innerText = "Live Secure Tunnel Tunneling Active";
            document.getElementById('state').style.color = "#10b981";
            client.subscribe("varunsbuildingwater789/data"); 
        });

        client.on('message', (topic, msg) => {
            try {
                const data = JSON.parse(msg.toString());
                if(data.h !== undefined) { document.getElementById('h-pct').innerText = data.h + "%"; document.getElementById('h-bar').style.width = data.h + "%"; }
                if(data.k !== undefined) { document.getElementById('k-pct').innerText = data.k + "%"; document.getElementById('k-bar').style.width = data.k + "%"; }
                if(data.s !== undefined) { document.getElementById('s-pct').innerText = data.s + "%"; document.getElementById('s-bar').style.width = data.s + "%"; }
            } catch(e) {}
        });

        function pulse(motor) {
            client.publish("varunsbuildingwater789/cmds", motor);
            alert("Sent quick pulse trigger signal to physical " + motor + " relay!");
        }

        function toggleZebronicsPlug() {
            // Put your custom private IFTTT cloud automation webhook link right here:
            fetch('https://ifttt.com')
            .then(res => { alert("Zebronics switch click command sent to cloud."); });
        }
    </script>
</body>
</html>
